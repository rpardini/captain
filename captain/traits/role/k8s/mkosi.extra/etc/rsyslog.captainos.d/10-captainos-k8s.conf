# Kubernetes nodes: also forward their provisioning and join (cloud-init, CAPT's bootstrap) and kubelet.
# captain-k8s-handoff: in-memory nodes (mem-k8s-capt-*); its Workflow Actions go out with tink-agent's.
if ($!_SYSTEMD_UNIT startswith "cloud-" or $!_SYSTEMD_UNIT == "kubelet.service" or $!_SYSTEMD_UNIT == "captain-k8s-handoff.service") then {
    call captain-forward
}
