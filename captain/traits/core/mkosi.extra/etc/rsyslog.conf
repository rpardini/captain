# CaptainOS rsyslog configuration
# Replaces the Debian default. Only forwards filtered logs to a remote
# syslog server via UDP — no local file logging, no imuxsock/imklog.

# ── Global settings ──────────────────────────────────────────────────
# Increase max message size to handle large JSON log lines
# (e.g., tink-agent hardware attribute payloads).
# processInternalMessages: rsyslog's own messages go through the rules below
# (instead of stderr), so its debug chatter can be dropped.
global(
    maxMessageSize="8192"
    workDirectory="/run/rsyslog"
    processInternalMessages="on"
)

# ── Inputs ───────────────────────────────────────────────────────────
# Read the systemd journal. Do NOT load imuxsock or imklog — we only
# want journal entries from specific units, not all daemon syslog output.
module(load="imjournal")

# Tail nerdctl container log files (workflow action stdout/stderr).
module(load="imfile")
input(type="imfile"
    File="/var/lib/nerdctl/*/containers/*/*/*-json.log"
    Tag="container"
    Severity="info"
    Facility="local0"
    addMetadata="on"
)

module(load="omjournal")

# ── Forwarding ───────────────────────────────────────────────────────
# RSYSLOG_SyslogProtocol23Format, but with the hostname the journal recorded
# for each entry: rsyslog's own %HOSTNAME% is fixed when it starts, and the
# hostname changes after that (DHCP, cloud-init, CAPT). Lines without one
# (imfile) fall back to rsyslog's.
template(name="CaptainSyslog" type="string"
    string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %$.host% %APP-NAME% %PROCID% %MSGID% %STRUCTURED-DATA% %msg%\n")

ruleset(name="captain-forward") {
    set $.host = $!_HOSTNAME;
    if ($.host == "") then {
        set $.host = $hostname;
    }
    action(type="omfwd"
        target=`echo $SYSLOG_HOST`
        port=`echo $SYSLOG_PORT`
        protocol="udp"
        template="CaptainSyslog"
    )
}

# ── Rules ────────────────────────────────────────────────────────────
# rsyslog's own messages: info and up to the journal, debug dropped.
# $inputname: not the journal's copies of them, which imjournal reads back.
if ($inputname == "rsyslogd") then {
    if ($syslogseverity <= 6) then {
        action(type="omjournal")
    }
    stop
}

# Forward tink-agent and tink-agent-setup journal entries
if ($!_SYSTEMD_UNIT == "tink-agent.service" or $!_SYSTEMD_UNIT == "tink-agent-setup.service") then {
    call captain-forward
}

# Forward container logs (from imfile).
# Match "container:" specifically — NOT "containerd" (the daemon).
if ($syslogtag startswith "container") then {
    call captain-forward
}

# Roles' own forwarding rules (eg. Kubernetes: cloud-init, kubelet). Not
# /etc/rsyslog.d: distro packages put their own (file logging) configs there.
include(file="/etc/rsyslog.captainos.d/*.conf" mode="optional")

# Discard everything else (no local logging)
*.* stop
