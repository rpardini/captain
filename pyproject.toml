[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
version = "0.0.1"
name = "captain"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "rich>=14.3.3",
    "jinja2>=3.1.6",
    "trogon>=0.6.0",
]

[project.scripts]
captain = "build:main"

[project.optional-dependencies]
dev = ["ruff>=0.15.9", "pyright>=1.1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"captain/iso.py" = ["E501"]  # embedded grub config has long data lines

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = ["mkosi.tools", "mkosi.output", "mkosi.input", "__pycache__"]
include = ["captain", "build.py"]
