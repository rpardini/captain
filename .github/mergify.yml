merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions:
      - base=main
      - or:
          - "#approved-reviews-by>=1"
          - author=jacobweinstock
      - "#changes-requested-reviews-by=0"
      - check-success=DCO
      - check-success=prepare
      - check-success=download-tools (amd64)
      - check-success=download-tools (arm64)
      - check-success=build-dockerfile (amd64)
      - check-success=build-dockerfile (arm64)
      - check-success=build-captainos-kernel (amd64)
      - check-success=build-captainos-kernel (arm64)
      - check-success=build-captainos trixie-full (amd64)
      - check-success=build-captainos trixie-full (arm64)
      - check-success=build-captainos trixie-rockchip64 (arm64)
      - check-success=build-captainos trixie-rockchip64-vendor (arm64)
      - check-success=build-captainos trixie-genio (arm64)
      - check-success=build-captainos trixie-meson64 (arm64)
      - check-success=build-captainos trixie-armbian-rpi (arm64)
      - check-success=build-captainos (with kernel) trixie-slim (amd64)
      - check-success=build-captainos (with kernel) trixie-slim (arm64)
      - label!=do-not-merge
      - label=ready-to-merge
    merge_conditions:
      # Conditions to get out of the queue (= merged)
      - base=main
      - or:
          - "#approved-reviews-by>=1"
          - author=jacobweinstock
      - "#changes-requested-reviews-by=0"
      - check-success=DCO
      - check-success=prepare
      - check-success=download-tools (amd64)
      - check-success=download-tools (arm64)
      - check-success=build-dockerfile (amd64)
      - check-success=build-dockerfile (arm64)
      - check-success=build-captainos-kernel (amd64)
      - check-success=build-captainos-kernel (arm64)
      - check-success=build-captainos trixie-full (amd64)
      - check-success=build-captainos trixie-full (arm64)
      - check-success=build-captainos trixie-rockchip64 (arm64)
      - check-success=build-captainos trixie-rockchip64-vendor (arm64)
      - check-success=build-captainos trixie-genio (arm64)
      - check-success=build-captainos trixie-meson64 (arm64)
      - check-success=build-captainos trixie-armbian-rpi (arm64)
      - check-success=build-captainos (with kernel) trixie-slim (amd64)
      - check-success=build-captainos (with kernel) trixie-slim (arm64)
      - label!=do-not-merge
      - label=ready-to-merge
      # This extra condition forces draft PR mode (prevents in-place checks)
      - queue-position>=0
    merge_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body
pull_request_rules:
  - name: refactored queue action rule
    conditions: []
    actions:
      queue:
merge_protections_settings:
  reporting_method: check-runs
