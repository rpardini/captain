name: Release
on:
  push:
    tags:
      - "v**"

permissions:
  contents: write
  packages: write

env:
  FORCE_COLOR: "1"
  CAPTAIN_VERBOSE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load shared config
        run: cat .github/config.env >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Pull release artifacts
        run: |
          # one line per flavor in the registry (captain/flavors.py): <id> <target> <arch> <tag-suffix>
          uv run captain list-flavors --release | while read -r flavor target arch _suffix; do
            uv run captain --flavor-id "${flavor}" --arch "${arch}" release --target "${target}" pull --pull-output release-artifacts < /dev/null
          done

      - name: "directories -> tarball"
        working-directory: out/release-artifacts
        run: |
          for dir in */; do
              # if not a directory, skip
              [[ ! -d "$dir" || "$dir" == "." || "$dir" == ".." ]] && continue
              tarball="${dir%/}.tar.gz"
              echo "Creating tarball for '$dir' -> '$tarball'"
              tar -czf "${dir%/}.tar.gz" "$dir"
              echo "Removing directory '$dir'"
              rm -rf "$dir"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            out/release-artifacts/* \
            --generate-notes \
            --title "${{ github.ref_name }}"

      - name: Tag all flavors
        run: |
          # tag suffixes are kept stable for already-published flavors (eg "" for trixie-full, "-slim", "-rpi")
          uv run captain list-flavors --release | while read -r flavor target arch suffix; do
            uv run captain --flavor-id "${flavor}" --arch "${arch}" release tag --new-tag "${{ github.ref_name }}${suffix}" < /dev/null
          done
